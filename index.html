<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rafa Kheiza Fathan - Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{
  --bg:#07080D; --bg2:#0E1019; --panel:#E5E8F2; --green:#8F96FF; --greenD:#4B4FD6;
  --ink:#E8EAF6; --soft:#9299B3; --line:rgba(232,234,246,.14);
  --serif:'Manrope',system-ui,sans-serif; --sans:'Inter',system-ui,sans-serif; --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
section[id],footer[id]{scroll-margin-top:72px}
body{font:400 16px/1.7 var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(139,148,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(139,148,255,.06) 1px,transparent 1px);background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 25%,transparent 80%)}
::selection{background:var(--green);color:var(--bg)}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
ul{list-style:none}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;line-height:1.15;letter-spacing:-.03em}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.sec{padding:clamp(72px,10vw,130px) 0}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 28px;border-top:1px solid var(--line);padding-top:20px;margin-bottom:clamp(32px,5vw,60px)}
.sec-head h2{font-size:clamp(30px,4.4vw,54px)}
.sec-head p{font-size:14.5px;color:var(--soft);max-width:520px}
.mark{font-size:13px;font-weight:500;color:var(--soft);min-width:110px;display:inline-flex;align-items:center}
.mark::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:9px;box-shadow:0 0 10px var(--green)}

/* NAV */
nav{position:fixed;inset:0 0 auto 0;z-index:50;background:rgba(7,8,13,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{height:64px;display:flex;align-items:center;justify-content:space-between}
.logo{font:800 22px var(--serif)}.logo b{color:var(--green)}
.links{display:flex;gap:6px}
.links a{font-size:14px;font-weight:500;color:var(--soft);padding:7px 14px;border-radius:8px;transition:color .3s,background .3s}
.links a:hover{color:var(--ink);background:rgba(232,234,246,.07)}
#menu-btn{display:none;background:none;border:0;font-size:22px;color:var(--ink);cursor:pointer}
#mobile-menu{display:none;border-top:1px solid var(--line);background:var(--bg)}
#mobile-menu.open{display:block}
#mobile-menu a{display:block;padding:14px clamp(20px,4vw,48px);border-bottom:1px solid var(--line);font-weight:500;transition:padding .3s var(--ease),color .3s}
#mobile-menu a:hover{color:var(--green);padding-left:calc(clamp(20px,4vw,48px) + 8px)}

/* BUTTONS */
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border:1px solid var(--line);border-radius:8px;font:600 14px var(--sans);cursor:pointer;background:rgba(232,234,246,.04);color:var(--ink);transition:border-color .3s,color .3s,background .3s,box-shadow .4s,transform .3s var(--ease)}
.btn:hover{border-color:var(--green);color:var(--green);transform:translateY(-2px)}
.btn.solid{background:var(--green);border-color:var(--green);color:#0A0B1A}
.btn.solid:hover{background:#B3B8FF;color:#0A0B1A;box-shadow:0 0 28px rgba(139,148,255,.35)}

/* HERO */
#home{padding:clamp(120px,14vw,176px) 0 clamp(70px,9vw,120px);position:relative;overflow:hidden}
#home::before{content:"";position:absolute;left:50%;bottom:-40%;width:130%;height:90%;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(139,148,255,.26),rgba(75,79,214,.10) 45%,transparent 70%);pointer-events:none}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:clamp(32px,6vw,90px);align-items:center;position:relative}
.badge{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;color:var(--green);border:1px solid rgba(139,148,255,.4);background:rgba(139,148,255,.08);border-radius:99px;padding:6px 16px;margin-bottom:26px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.hero h1{font-size:clamp(38px,6.2vw,86px);line-height:1.04;letter-spacing:-.04em}
.hero h1 em{display:block;font-style:normal;background:linear-gradient(90deg,#8F96FF,#C4A8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{margin-top:28px;max-width:560px;font-size:18px;color:var(--soft)}
.hero .lead strong{color:var(--ink);font-weight:600}
.contact-row{display:flex;flex-wrap:wrap;align-items:center;gap:20px;margin-top:38px;padding-top:22px;border-top:1px solid var(--line);font-size:14px;color:var(--soft)}
.contact-row a{font-size:21px;color:var(--ink);transition:color .3s,transform .3s var(--ease)}
.contact-row a:hover{color:var(--green);transform:translateY(-3px)}
.contact-row .loc{border-left:1px solid var(--line);padding-left:18px}
.portrait{position:relative;justify-self:center;width:min(100%,400px)}
.portrait .frame{aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);position:relative;z-index:1;transition:transform .7s var(--ease),border-color .4s}
.portrait::before{content:"";position:absolute;inset:16px -16px -16px 16px;border:1px solid rgba(139,148,255,.45);border-radius:18px;transition:inset .6s var(--ease)}
.portrait:hover::before{inset:8px -8px -8px 8px}
.portrait:hover .frame{transform:translate(-4px,-4px);border-color:rgba(139,148,255,.6)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:top}
.rise>*{opacity:0;transform:translateY(18px);animation:rise .9s var(--ease) forwards}
.rise>*:nth-child(2){animation-delay:.12s}.rise>*:nth-child(3){animation-delay:.24s}.rise>*:nth-child(4){animation-delay:.36s}.rise>*:nth-child(5){animation-delay:.48s}
@keyframes rise{to{opacity:1;transform:none}}

/* ABOUT */
.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(36px,6vw,96px)}
.two h3{font-size:26px;margin-bottom:24px}
.two p{color:var(--soft);margin-bottom:20px;font-size:17px}
.two p strong{color:var(--ink);font-weight:600}
.edu{border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:14px;background:var(--bg2);display:grid;grid-template-columns:1fr auto;gap:6px 16px;transition:border-color .4s,transform .4s var(--ease),background .4s}
.edu:hover{border-color:rgba(139,148,255,.55);transform:translateY(-3px);background:#12152B}
.edu h4{font-size:20px}.edu .yr{font-size:13px;color:var(--soft);padding-top:5px}
.edu .deg{color:var(--green);font-weight:600;font-size:15px}.edu .fac{font-size:14px;color:var(--soft)}

/* SKILLS - light mint panel */
.bento{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-radius:20px;overflow:hidden;--ink:#0C0E1A;--soft:#4F566B;--line:rgba(12,14,26,.14);color:var(--ink)}
.cell{padding:clamp(24px,3vw,40px);border-right:1px solid var(--line);transition:background .5s var(--ease)}
.cell:last-child{border-right:0}
.cell:hover{background:rgba(255,255,255,.55)}
.cell .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:17px;margin-bottom:22px;background:#0C0E1A;color:var(--green);transition:transform .5s var(--ease)}
.cell:hover .ico{transform:rotate(-8deg) scale(1.08)}
.cell h3{font-size:22px;margin-bottom:20px}
.cell li{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-weight:500;font-size:15px;line-height:1.5}
.cell li i{color:var(--greenD);width:20px;text-align:center;margin-top:3px}
.cell li small{display:block;font-weight:400;font-size:12.5px;color:var(--soft)}

/* RESEARCH - analytical case-study panel */
#project{background:radial-gradient(60% 45% at 50% 100%,rgba(139,148,255,.14),transparent 70%)}
.lab{display:grid;grid-template-columns:7fr 5fr;gap:clamp(28px,5vw,64px);align-items:start;background:var(--panel);border-radius:22px;padding:clamp(22px,4vw,56px);--ink:#0C0E1A;--soft:#4F566B;--line:rgba(12,14,26,.16);color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.tags span{font-size:12.5px;font
